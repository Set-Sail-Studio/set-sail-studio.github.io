<script>
// Marca en el índice la sección que se está leyendo.
(function () {
  var enlaces = document.querySelectorAll('.indice a');
  if (!enlaces.length || !('IntersectionObserver' in window)) return;
  var mapa = {};
  enlaces.forEach(function (a) { mapa[a.getAttribute('href').slice(1)] = a; });
  var obs = new IntersectionObserver(function (vistas) {
    vistas.forEach(function (v) {
      if (!v.isIntersecting) return;
      enlaces.forEach(function (a) { a.classList.remove('aqui'); });
      var a = mapa[v.target.id];
      if (a) a.classList.add('aqui');
    });
  }, { rootMargin: '-20% 0px -70% 0px' });
  document.querySelectorAll('article section[id]').forEach(function (s) { obs.observe(s); });
  if (window.matchMedia('(min-width: 70rem)').matches) {
    var d = document.querySelector('.indice details');
    if (d) d.open = true;
  }
})();
</script>
