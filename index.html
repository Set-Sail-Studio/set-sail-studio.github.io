<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#080A0A">
<meta name="description" content="Set Sail Studio: small games with a candle lit.">
<title>Set Sail Studio</title>
<link rel="icon" href="dead-wrong/icono.png">
<link rel="stylesheet" href="dead-wrong/estilo.css">
<style>
  .estudio-titulo { font-family: var(--titulos); color: var(--tinta); letter-spacing: .3em; text-transform: uppercase; font-size: clamp(1.4rem, 5vw, 2.1rem); margin: 0; }
  .juego { display: flex; flex-direction: column; align-items: center; gap: .9rem; margin-top: 2.6rem; border: 0; color: var(--tinta); }
  .juego img { width: 96px; height: 96px; box-shadow: 0 0 70px -12px rgba(232, 168, 76, .4); }
  .juego span { font-family: var(--titulos); letter-spacing: .18em; text-transform: uppercase; }
  .juego:hover span { color: var(--vela-viva); }
</style>
</head>
<body>
<main class="portada">
  <h1 class="estudio-titulo">Set Sail Studio</h1>
  <hr class="filete">
  <a class="juego" href="dead-wrong/"><img src="dead-wrong/icono.png" alt="" width="96" height="96"><span>Dead Wrong</span></a>
  <p class="lema" style="margin-top:1.4rem">One horror story a day. Any choice can kill you.</p>
</main>
<footer class="pie"><p><a href="mailto:setsailstudio.deadwrong@gmail.com">setsailstudio.deadwrong@gmail.com</a></p></footer>
</body>
</html>
